<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EZRAlms — Dashboard</title>
    <meta name="description" content="EZRAlms Library Dashboard – overview stats, charts and overdue loans">
    <link rel="stylesheet" href="/css/global.css">
    <style>
        /* ── Dashboard grid ─────────────────────────── */
        .dash-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 28px;
            align-items: start;
        }

        @media (max-width: 1100px) {
            .dash-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ── Stat icon colours ──────────────────────── */
        .stat-icon.orange {
            background: #FF6B35;
        }

        .stat-icon.red {
            background: #EF4444;
        }

        .stat-icon.purple {
            background: #8B5CF6;
        }

        .stat-icon.blue {
            background: #3B82F6;
        }

        /* ── Chart card ─────────────────────────────── */
        .chart-card {
            background: var(--dark-chart);
            border-radius: var(--radius);
            padding: 28px 24px 20px;
            margin-bottom: 28px;
            position: relative;
        }

        .chart-legend {
            display: flex;
            gap: 20px;
            margin-bottom: 16px;
            justify-content: center;
        }

        .chart-legend span {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #aaa;
        }

        .chart-legend span::before {
            content: '';
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .chart-legend .visitors::before {
            background: #FF6B35;
        }

        .chart-legend .borrowers::before {
            background: #333;
        }

        .chart-canvas-wrap {
            width: 100%;
            height: 260px;
            position: relative;
        }

        .chart-canvas-wrap canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ── Overdue section ────────────────────────── */
        .overdue-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .overdue-header h2 {
            font-size: 20px;
            font-weight: 700;
        }

        .see-all {
            color: var(--accent);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .see-all:hover {
            text-decoration: underline;
        }

        /* ── Quick review panel ─────────────────────── */
        .qr-panel {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            padding: 0;
            position: sticky;
            top: 32px;
        }

        .qr-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 0;
        }

        .qr-header h3 {
            font-size: 16px;
            font-weight: 700;
        }

        .qr-close {
            color: var(--text-sec);
            font-size: 18px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .qr-body {
            padding: 20px;
        }

        .qr-profile {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .qr-profile img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }

        .qr-profile .qr-name {
            font-weight: 700;
            font-size: 15px;
        }

        .qr-profile .qr-sub {
            font-size: 12px;
            color: var(--text-sec);
        }

        .qr-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }

        .qr-actions .btn {
            flex: 1;
            justify-content: center;
            font-size: 12px;
            padding: 8px 10px;
        }

        .qr-section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .qr-badge {
            background: var(--accent);
            color: #fff;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
        }

        .qr-book {
            display: flex;
            gap: 14px;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
        }

        .qr-book:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .qr-book img {
            width: 60px;
            height: 82px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: var(--shadow-sm);
        }

        .qr-book-info {
            flex: 1;
        }

        .qr-book-title {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .qr-book-author {
            font-size: 12px;
            color: var(--text-sec);
            margin-bottom: 4px;
        }

        .qr-book-id {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .qr-overdue-text {
            color: var(--red);
            font-size: 12px;
            font-weight: 600;
        }

        .qr-dates {
            display: flex;
            gap: 20px;
            margin-top: 6px;
        }

        .qr-dates .qr-date-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .qr-dates .qr-date-value {
            font-size: 12px;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <!-- Stats -->
    <div class="page-header">
        <div style="display:flex;align-items:center;gap:14px;">
            <h1>Dashboard</h1>
            <select class="period-select" id="period-select">
                <option value="weekly">weekly</option>
                <option value="monthly" selected>monthly</option>
                <option value="yearly">yearly</option>
            </select>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-icon orange">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 6v6l4 2" />
                </svg>
            </div>
            <div>
                <div class="stat-label">borrowed</div>
                <div class="stat-value" id="stat-borrowed">—</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon red">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="9" y1="9" x2="15" y2="15" />
                    <line x1="15" y1="9" x2="9" y2="15" />
                </svg>
            </div>
            <div>
                <div class="stat-label">overdue</div>
                <div class="stat-value" id="stat-overdue">—</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon purple">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
                    <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 00-3-3.87" />
                    <path d="M16 3.13a4 4 0 010 7.75" />
                </svg>
            </div>
            <div>
                <div class="stat-label">visitors</div>
                <div class="stat-value" id="stat-visitors">—</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon blue">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
                    <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                    <circle cx="8.5" cy="7" r="4" />
                    <line x1="20" y1="8" x2="20" y2="14" />
                    <line x1="23" y1="11" x2="17" y2="11" />
                </svg>
            </div>
            <div>
                <div class="stat-label">new members</div>
                <div class="stat-value" id="stat-newmembers">—</div>
            </div>
        </div>
    </div>

    <!-- Two-column grid: chart+table / quick review -->
    <div class="dash-grid">
        <div class="dash-left">
            <!-- Chart -->
            <div class="chart-card">
                <div class="chart-legend">
                    <span class="visitors">visitors</span>
                    <span class="borrowers">Borrowers</span>
                </div>
                <div class="chart-canvas-wrap">
                    <canvas id="chart-canvas"></canvas>
                </div>
            </div>

            <!-- Overdue table -->
            <div class="overdue-header">
                <h2>Overdue book loans</h2>
                <a class="see-all" href="/loans.html?status=overdue">See All</a>
            </div>
            <div class="card">
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Member</th>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Overdue</th>
                                <th>Return date</th>
                            </tr>
                        </thead>
                        <tbody id="overdue-tbody">
                            <tr>
                                <td colspan="6" class="loading-state">
                                    <div class="spinner"></div> Loading…
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Quick Review Panel -->
        <div class="qr-panel" id="qr-panel">
            <div class="qr-header">
                <h3>Quick reviews</h3>
                <button class="qr-close" id="qr-close">✕</button>
            </div>
            <div class="qr-body" id="qr-body">
                <div class="loading-state">
                    <div class="spinner"></div> Loading…
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { api, showToast } from '/js/api.js';
        import { initShell } from '/js/sidebar.js';

        initShell('dashboard');

        // ── Load stats ──────────────────────────────
        async function loadStats() {
            try {
                const s = await api.stats();
                document.getElementById('stat-borrowed').textContent = s.borrowed;
                document.getElementById('stat-overdue').textContent = s.overdue;
                document.getElementById('stat-visitors').textContent = s.visitors;
                document.getElementById('stat-newmembers').textContent = s.new_members;
            } catch (e) { console.error('[Stats]', e); }
        }

        // ── Draw Chart ──────────────────────────────
        async function loadChart() {
            try {
                const period = document.getElementById('period-select').value;
                const c = await api.chart(period, 2023);
                drawChart(c.data);
            } catch (e) { console.error('[Chart]', e); }
        }

        function drawChart(data) {
            const canvas = document.getElementById('chart-canvas');
            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            const W = rect.width, H = rect.height;

            ctx.clearRect(0, 0, W, H);

            const monthLabels = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '10', '11', '12'];
            const maxVal = Math.max(...data.map(d => Math.max(d.visitors, d.borrowers)), 1);
            const padL = 40, padR = 20, padT = 20, padB = 40;
            const cW = W - padL - padR;
            const cH = H - padT - padB;
            const barGroupW = cW / 12;
            const barW = barGroupW * 0.28;
            const gap = barGroupW * 0.06;

            // Grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.07)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 4; i++) {
                const y = padT + (cH / 4) * i;
                ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
            }

            // Y-axis labels
            ctx.fillStyle = 'rgba(255,255,255,0.35)';
            ctx.font = '11px Inter, sans-serif';
            ctx.textAlign = 'right';
            for (let i = 0; i <= 4; i++) {
                const y = padT + (cH / 4) * i;
                const val = Math.round(maxVal - (maxVal / 4) * i);
                ctx.fillText(val, padL - 8, y + 4);
            }

            // Bars
            data.forEach((d, i) => {
                const x = padL + i * barGroupW + barGroupW * 0.2;
                const vH = (d.visitors / maxVal) * cH;
                const bH = (d.borrowers / maxVal) * cH;

                // Visitor bar (orange)
                ctx.beginPath();
                const vx = x, vy = padT + cH - vH;
                roundRect(ctx, vx, vy, barW, vH, 3);
                ctx.fillStyle = '#FF6B35';
                ctx.fill();

                // Borrower bar (dark)
                ctx.beginPath();
                const bx = x + barW + gap, by = padT + cH - bH;
                roundRect(ctx, bx, by, barW, bH, 3);
                ctx.fillStyle = '#444';
                ctx.fill();

                // Month label
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                ctx.font = '11px Inter, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(monthLabels[i], x + barW + gap / 2, H - padB + 20);
            });
        }

        function roundRect(ctx, x, y, w, h, r) {
            if (h < 1) { h = 1; y = y + h - 1; }
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x, y + h);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
        }

        // ── Overdue table ───────────────────────────
        let overdueData = [];
        async function loadOverdue() {
            try {
                overdueData = await api.overdue();
                renderOverdueTable(overdueData.slice(0, 6));
                if (overdueData.length > 0) renderQuickReview(overdueData[0]);
            } catch (e) { console.error('[Overdue]', e); }
        }

        function renderOverdueTable(rows) {
            const tbody = document.getElementById('overdue-tbody');
            if (!rows.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><h3>No overdue loans</h3></td></tr>';
                return;
            }
            tbody.innerHTML = rows.map((r, i) => `
        <tr class="${i === 1 ? 'highlighted' : ''}" data-idx="${i}" style="cursor:pointer">
          <td>${r.member_code}</td>
          <td>${r.member_name}</td>
          <td>${r.title ? r.title.substring(0, 20) + (r.title.length > 20 ? '…' : '') : ''}</td>
          <td>${r.author}</td>
          <td><span class="badge badge-red">${r.days_overdue} days</span></td>
          <td>${formatDate(r.due_date)}</td>
        </tr>`).join('');

            tbody.querySelectorAll('tr').forEach(tr => {
                tr.addEventListener('click', () => {
                    const idx = parseInt(tr.dataset.idx);
                    tbody.querySelectorAll('tr').forEach(r => r.classList.remove('highlighted'));
                    tr.classList.add('highlighted');
                    renderQuickReview(rows[idx]);
                });
            });
        }

        // ── Quick Review ────────────────────────────
        function renderQuickReview(member) {
            const body = document.getElementById('qr-body');
            // Get all overdue books by this member
            const memberBooks = overdueData.filter(o => o.member_code === member.member_code);
            const initials = member.member_name ? member.member_name.split(' ').map(n => n[0]).join('').substring(0, 2) : '?';
            const profileImg = member.member_photo
                ? `<img src="${member.member_photo}" alt="">`
                : `<div class="avatar-placeholder md">${initials}</div>`;

            body.innerHTML = `
        <div class="qr-profile">
          ${profileImg}
          <div>
            <div class="qr-name">${member.member_name}</div>
            <div class="qr-sub">${member.member_email || ''}</div>
          </div>
        </div>
        <div class="qr-actions">
          <button class="btn btn-outline btn-sm" onclick="window.location.href='mailto:${member.member_email || ''}'">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            Send an email
          </button>
          <button class="btn btn-outline btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.13.81.36 1.61.68 2.37a2 2 0 01-.45 2.11L8.09 9.45a16 16 0 006.46 6.46l1.25-1.25a2 2 0 012.11-.45c.76.32 1.56.55 2.37.68A2 2 0 0122 16.92z"/></svg>
            Call ${member.member_name.split(' ')[1] || ''}
          </button>
        </div>
        <div class="qr-section-title">Borrowed book <span class="qr-badge">${memberBooks.length}</span></div>
        ${memberBooks.map(b => `
          <div class="qr-book">
            <img src="${b.cover_url || 'https://via.placeholder.com/60x82?text=Book'}" alt="${b.title}">
            <div class="qr-book-info">
              <div class="qr-book-title">${b.title}</div>
              <div class="qr-book-author">${b.author}</div>
              <div class="qr-book-id">${member.member_code} &nbsp; <span class="qr-overdue-text">· ${b.days_overdue} days Overdue</span></div>
              <div class="qr-dates">
                <div><div class="qr-date-label">Borrowed</div><div class="qr-date-value">${formatDate(b.borrowed_at)}</div></div>
                <div><div class="qr-date-label">Return</div><div class="qr-date-value">${formatDate(b.due_date)}</div></div>
              </div>
            </div>
          </div>
        `).join('')}`;
        }

        function formatDate(d) {
            if (!d) return '—';
            const dt = new Date(d);
            return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // ── Close quick review ─────────────────────
        document.getElementById('qr-close').addEventListener('click', () => {
            document.getElementById('qr-panel').style.display = 'none';
        });

        // ── Period change ──────────────────────────
        document.getElementById('period-select').addEventListener('change', loadChart);

        // ── Resize chart ───────────────────────────
        window.addEventListener('resize', loadChart);

        // ── Init ────────────────────────────────────
        loadStats();
        loadChart();
        loadOverdue();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EZRAlms — Members</title>
    <meta name="description" content="EZRAlms Member Management – browse, add and manage library members">
    <link rel="stylesheet" href="/css/global.css">
    <style>
        .member-row {
            cursor: pointer;
        }

        .member-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
        }

        .member-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .member-cell .name {
            font-weight: 600;
        }

        .member-cell .mid {
            font-size: 11px;
            color: var(--text-muted);
        }

        /* Detail drawer */
        .member-drawer {
            position: fixed;
            right: -420px;
            top: 0;
            width: 400px;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: -4px 0 24px rgba(0, 0, 0, .12);
            z-index: 500;
            transition: right .3s ease;
            overflow-y: auto;
            padding: 32px 24px;
        }

        .member-drawer.open {
            right: 0;
        }

        .drawer-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .3);
            z-index: 499;
            display: none;
        }

        .drawer-overlay.open {
            display: block;
        }

        .drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .drawer-header h3 {
            font-size: 18px;
            font-weight: 700;
        }

        .drawer-close {
            font-size: 20px;
            cursor: pointer;
            color: var(--text-sec);
            background: none;
            border: none;
        }

        .drawer-profile {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .drawer-profile img {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
        }

        .drawer-profile h4 {
            font-size: 16px;
            font-weight: 700;
        }

        .drawer-profile .email {
            font-size: 13px;
            color: var(--text-sec);
        }

        .drawer-profile .phone {
            font-size: 13px;
            color: var(--text-muted);
        }

        .drawer-section-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .drawer-loan-item {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--bg);
        }

        .drawer-loan-item img {
            width: 44px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
        }

        .drawer-loan-item .title {
            font-weight: 600;
            font-size: 13px;
        }

        .drawer-loan-item .author {
            font-size: 12px;
            color: var(--text-sec);
        }

        .drawer-loan-item .due {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>

<body>
    <div class="page-header">
        <h1>Members</h1>
        <button class="btn btn-primary" id="add-member-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Add Member
        </button>
    </div>

    <div class="toolbar">
        <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="member-search" placeholder="Search by name, id, or email…">
        </div>
    </div>

    <div class="card">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Member</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Active Loans</th>
                        <th>Overdue</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="members-tbody">
                    <tr>
                        <td colspan="6" class="loading-state">
                            <div class="spinner"></div> Loading…
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="pagination" id="pagination"></div>

    <!-- Drawer overlay -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="member-drawer" id="member-drawer">
        <div class="drawer-header">
            <h3>Member Details</h3>
            <button class="drawer-close" id="drawer-close">✕</button>
        </div>
        <div id="drawer-content"></div>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="member-modal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Add Member</h2>
                <button class="modal-close"
                    onclick="document.getElementById('member-modal').classList.remove('open')">✕</button>
            </div>
            <form id="member-form">
                <input type="hidden" id="m-id">
                <div class="form-row">
                    <div class="form-group"><label class="form-label" for="f-mid">Member ID *</label><input id="f-mid"
                            required placeholder="e.g. 21344123"></div>
                    <div class="form-group"><label class="form-label" for="f-name">Full Name *</label><input id="f-name"
                            required></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label class="form-label" for="f-email">Email</label><input id="f-email"
                            type="email"></div>
                    <div class="form-group"><label class="form-label" for="f-phone">Phone</label><input id="f-phone">
                    </div>
                </div>
                <div class="form-group"><label class="form-label" for="f-photo">Photo URL</label><input id="f-photo"
                        placeholder="https://…"></div>
                <div class="form-actions">
                    <button type="button" class="btn btn-outline"
                        onclick="document.getElementById('member-modal').classList.remove('open')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Delete Confirm -->
    <div class="modal-overlay" id="del-modal">
        <div class="modal" style="max-width:400px;text-align:center;">
            <h2 style="margin-bottom:12px;">Delete Member?</h2>
            <p style="color:var(--text-sec);font-size:14px;margin-bottom:24px;">This action cannot be undone.</p>
            <div class="form-actions" style="justify-content:center;">
                <button class="btn btn-outline"
                    onclick="document.getElementById('del-modal').classList.remove('open')">Cancel</button>
                <button class="btn btn-danger" id="del-confirm">Delete</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { api, showToast } from '/js/api.js';
        import { initShell } from '/js/sidebar.js';
        initShell('members');

        let currentPage = 1, deleteId = null;

        async function loadMembers() {
            const q = document.getElementById('member-search').value;
            try {
                const res = await api.members({ q, page: currentPage, limit: 20 });
                renderTable(res.members);
                renderPagination(res.total, res.page, res.limit);
            } catch (e) { showToast(e.message, 'error'); }
        }

        function renderTable(members) {
            const tbody = document.getElementById('members-tbody');
            if (!members.length) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><h3>No members found</h3></td></tr>';
                return;
            }
            tbody.innerHTML = members.map(m => `
        <tr class="member-row" data-id="${m.id}">
          <td>
            <div class="member-cell">
              ${m.photo ? `<img class="member-avatar" src="${m.photo}" alt="">` : `<div class="avatar-placeholder sm">${m.name ? m.name.split(' ').map(n => n[0]).join('').substring(0, 2) : '?'}</div>`}
              <div><div class="name">${m.name}</div><div class="mid">${m.member_id}</div></div>
            </div>
          </td>
          <td>${m.email || '—'}</td>
          <td>${m.phone || '—'}</td>
          <td>${m.active_loans || 0}</td>
          <td>${m.overdue_count ? `<span class="badge badge-red">${m.overdue_count}</span>` : '<span class="badge badge-green">0</span>'}</td>
          <td>
            <button class="btn btn-sm btn-outline edit-member" data-id="${m.id}" title="Edit">✎</button>
            <button class="btn btn-sm btn-outline del-member" data-id="${m.id}" title="Delete" style="margin-left:4px;">✕</button>
          </td>
        </tr>`).join('');

            // Row click → drawer
            tbody.querySelectorAll('.member-row').forEach(tr => {
                tr.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    openDrawer(parseInt(tr.dataset.id));
                });
            });
            tbody.querySelectorAll('.edit-member').forEach(btn => btn.addEventListener('click', () => editMember(parseInt(btn.dataset.id))));
            tbody.querySelectorAll('.del-member').forEach(btn => btn.addEventListener('click', () => { deleteId = parseInt(btn.dataset.id); document.getElementById('del-modal').classList.add('open'); }));
        }

        function renderPagination(total, page, limit) {
            const pages = Math.ceil(total / limit);
            const el = document.getElementById('pagination');
            if (pages <= 1) { el.innerHTML = ''; return; }
            el.innerHTML = Array.from({ length: pages }, (_, i) =>
                `<button class="page-btn ${i + 1 === page ? 'active' : ''}" onclick="window._goPage(${i + 1})">${i + 1}</button>`
            ).join('');
        }
        window._goPage = (p) => { currentPage = p; loadMembers(); };

        // ── Drawer ────────────────────────────
        async function openDrawer(id) {
            try {
                const m = await api.member(id);
                const content = document.getElementById('drawer-content');
                content.innerHTML = `
          <div class="drawer-profile">
            ${m.photo ? `<img src="${m.photo}" alt="">` : `<div class="avatar-placeholder lg">${m.name ? m.name.split(' ').map(n => n[0]).join('').substring(0, 2) : '?'}</div>`}
            <div>
              <h4>${m.name}</h4>
              <div class="email">${m.email || '—'}</div>
              <div class="phone">${m.phone || '—'}</div>
            </div>
          </div>
          <div class="drawer-section-title">Borrowed Books (${(m.loans || []).length})</div>
          ${(m.loans || []).map(l => `
            <div class="drawer-loan-item">
              <img src="${l.cover_url || ''}" alt="">
              <div>
                <div class="title">${l.title}</div>
                <div class="author">${l.author}</div>
                <div class="due">Due: ${new Date(l.due_date).toLocaleDateString()}</div>
                <span class="badge ${l.status === 'overdue' ? 'badge-red' : 'badge-blue'}">${l.status}</span>
              </div>
            </div>`).join('') || '<p style="color:var(--text-sec);font-size:13px;">No active loans</p>'}`;
                document.getElementById('member-drawer').classList.add('open');
                document.getElementById('drawer-overlay').classList.add('open');
            } catch (e) { showToast(e.message, 'error'); }
        }

        function closeDrawer() {
            document.getElementById('member-drawer').classList.remove('open');
            document.getElementById('drawer-overlay').classList.remove('open');
        }
        document.getElementById('drawer-close').addEventListener('click', closeDrawer);
        document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

        // ── Add / Edit ────────────────────────────
        document.getElementById('add-member-btn').addEventListener('click', () => {
            document.getElementById('modal-title').textContent = 'Add Member';
            document.getElementById('member-form').reset();
            document.getElementById('m-id').value = '';
            document.getElementById('member-modal').classList.add('open');
        });

        async function editMember(id) {
            try {
                const m = await api.member(id);
                document.getElementById('modal-title').textContent = 'Edit Member';
                document.getElementById('m-id').value = id;
                document.getElementById('f-mid').value = m.member_id;
                document.getElementById('f-name').value = m.name;
                document.getElementById('f-email').value = m.email || '';
                document.getElementById('f-phone').value = m.phone || '';
                document.getElementById('f-photo').value = m.photo || '';
                document.getElementById('member-modal').classList.add('open');
            } catch (e) { showToast(e.message, 'error'); }
        }

        document.getElementById('member-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('m-id').value;
            const data = {
                member_id: document.getElementById('f-mid').value,
                name: document.getElementById('f-name').value,
                email: document.getElementById('f-email').value,
                phone: document.getElementById('f-phone').value,
                photo: document.getElementById('f-photo').value,
            };
            try {
                if (id) { await api.updateMember(id, data); showToast('Member updated'); }
                else { await api.addMember(data); showToast('Member added'); }
                document.getElementById('member-modal').classList.remove('open');
                loadMembers();
            } catch (e) { showToast(e.message, 'error'); }
        });

        // ── Delete ────────────────────────────
        document.getElementById('del-confirm').addEventListener('click', async () => {
            try {
                await api.deleteMember(deleteId);
                showToast('Member deleted');
                document.getElementById('del-modal').classList.remove('open');
                loadMembers();
            } catch (e) { showToast(e.message, 'error'); }
        });

        // ── Search ────────────────────────────
        let timer;
        document.getElementById('member-search').addEventListener('input', () => {
            clearTimeout(timer);
            timer = setTimeout(() => { currentPage = 1; loadMembers(); }, 300);
        });

        loadMembers();
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EZRAlms — Settings</title>
    <meta name="description" content="EZRAlms Settings – manage your profile and preferences">
    <link rel="stylesheet" href="/css/global.css">
    <style>
        .settings-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: var(--shadow-sm);
            padding: 32px;
            max-width: 600px;
        }

        .profile-section {
            display: flex;
            align-items: center;
            gap: 24px;
            margin-bottom: 32px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }

        .profile-avatar {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent);
            box-shadow: var(--shadow-md);
        }

        .profile-info h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-info .email {
            font-size: 14px;
            color: var(--text-sec);
            margin-bottom: 2px;
        }

        .profile-info .role {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 10px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 600;
            background: var(--accent-dim);
            color: var(--accent);
            margin-top: 6px;
        }

        .settings-group {
            margin-bottom: 28px;
        }

        .settings-group h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .danger-zone {
            border-top: 1px solid var(--border);
            padding-top: 24px;
            margin-top: 12px;
        }

        .danger-zone h3 {
            color: var(--red);
        }
    </style>
</head>

<body>
    <div class="page-header">
        <h1>Settings</h1>
    </div>

    <div class="settings-card">
        <div class="profile-section">
            <div id="s-avatar-container"></div>
            <div class="profile-info">
                <h2 id="s-name">—</h2>
                <div class="email" id="s-email">—</div>
                <span class="role" id="s-role">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                    </svg>
                    librarian
                </span>
            </div>
        </div>

        <div class="settings-group">
            <h3>Account Information</h3>
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="f-name" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" id="f-email" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Member Since</label>
                <input type="text" id="f-since" disabled>
            </div>
        </div>

        <div class="settings-group">
            <h3>Application</h3>
            <div class="form-group">
                <label class="form-label">Version</label>
                <input type="text" value="EZRAlms v1.0.0" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Backend</label>
                <input type="text" value="Cloudflare Workers + D1" disabled>
            </div>
        </div>

        <div class="danger-zone">
            <h3>Session</h3>
            <p style="color:var(--text-sec);font-size:14px;margin-bottom:16px;">Sign out of your current session. You
                will need to log in again.</p>
            <button class="btn btn-danger" id="logout-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                Logout
            </button>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { api, getUser, clearToken } from '/js/api.js';
        import { initShell } from '/js/sidebar.js';
        initShell('settings');

        const user = getUser();
        document.getElementById('s-name').textContent = user.name || '—';
        document.getElementById('s-email').textContent = user.email || '—';
        document.getElementById('s-role').innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> ${user.role || 'librarian'}`;

        const avatarContainer = document.getElementById('s-avatar-container');
        if (user.avatar) {
            avatarContainer.innerHTML = `<img class="profile-avatar" src="${user.avatar}" alt="avatar">`;
        } else {
            const initials = user.name ? user.name.split(' ').map(n => n[0]).join('').substring(0, 2) : '?';
            avatarContainer.innerHTML = `<div class="avatar-placeholder lg">${initials}</div>`;
        }

        document.getElementById('f-name').value = user.name || '';
        document.getElementById('f-email').value = user.email || '';
        document.getElementById('f-since').value = 'Account created';

        document.getElementById('logout-btn').addEventListener('click', () => {
            clearToken();
            window.location.href = '/';
        });
    </script>
</body>

</html>

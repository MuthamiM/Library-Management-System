name = "ezralms-api"
main = "src/worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[[ d1_databases ]]
binding = "DB"
database_name = "ezralms-db"
database_id = "local"

[dev]
port = 8787

[[rules]]
type = "ESModule"
globs = ["**/*.js"]

[assets]
directory = "./public"
binding = "ASSETS"
